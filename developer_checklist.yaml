# PRIORITY 1: Feature 2 - Named Program Cache System (FOUNDATIONAL)
# Start with this because Features 1 and 3 both depend on it
phase_program_cache:
  name: "Named Program Cache System"
  status: TODO
  priority: CRITICAL
  description: |
    Replace hash-based caching with user-friendly named programs and aliases.
    Users can save validation programs with names like "20241202-143022-ClinicalTrial"
    and create aliases like "johnDoesFav01". Admin can delete bad programs.
  estimated_effort: "1-2 weeks"
  depends_on: []
  blocks: ["phase_logic_validation", "phase_rest_api"]

  tasks:
    - id: cache_1
      name: "Create Data Model and Database Schema"
      description: "Design ValidationProgram dataclass and SQLite schema"
      status: TODO
      priority: CRITICAL
      effort: "1 day"
      files_to_create:
        - "src/program_cache.py"
      notes: |
        Create ValidationProgram dataclass with:
        - program_id (UUID)
        - name (auto-generated: YYYYMMDD-HHMMSS-description)
        - aliases (list of user-friendly names)
        - dictionary_source, dictionary_hash
        - generated_code (validation Python code)
        - schema, rules, metadata
        - created_by, created_at, last_used, use_count
        - status (active/deleted)

        Create SQLite database (~/.data_analyzer/programs.db):
        - programs table
        - aliases table
        - execution_history table

        See IMPLEMENTATION_PLAN.md section "Feature 2" for complete schema

    - id: cache_2
      name: "Implement ProgramDatabase Class"
      description: "SQLite interface for program CRUD operations"
      status: TODO
      priority: CRITICAL
      effort: "2 days"
      depends_on: ["cache_1"]
      files_to_create:
        - "src/program_cache.py"
      methods_to_implement:
        - "save_program()"
        - "load_program(id_or_name_or_alias)"
        - "search_programs()"
        - "list_all_programs()"
        - "create_alias()"
        - "delete_program() - admin only"
        - "restore_program() - admin only"
        - "increment_use_count()"
        - "record_execution()"
      notes: |
        Implement all database operations with:
        - Parameterized queries (SQL injection prevention)
        - Error handling and logging
        - Transaction support
        - Unique constraint checking for aliases

    - id: cache_3
      name: "Implement ProgramManager Class"
      description: "High-level interface for program management"
      status: TODO
      priority: HIGH
      effort: "2 days"
      depends_on: ["cache_2"]
      files_to_create:
        - "src/program_manager.py"
      methods_to_implement:
        - "create_program_from_dictionary()"
        - "find_or_create_program()"
        - "execute_program()"
        - "search_programs()"
      notes: |
        ProgramManager orchestrates:
        - LLMDictionaryParser (parse dictionary)
        - LogicCodeGenerator (generate code) - will be implemented in Feature 1
        - ProgramDatabase (save/load programs)

        Handles graceful degradation:
        - If program deleted → offer to regenerate
        - If program fails → return error with suggestion

    - id: cache_4
      name: "Implement Auto-Naming Logic"
      description: "Generate meaningful names from dictionary content"
      status: TODO
      priority: MEDIUM
      effort: "1 day"
      depends_on: ["cache_2"]
      files_to_modify:
        - "src/program_manager.py"
      notes: |
        Format: YYYYMMDD-HHMMSS-{description}

        Description generation strategies:
        1. Use dictionary name from metadata
        2. Use source filename
        3. Analyze field names for domain (clinical, employee, etc.)
        4. Default to "DataValidation"

        Examples:
        - "20241202-143022-ClinicalTrial"
        - "20241202-151530-EmployeeRecords"

    - id: cache_5
      name: "Implement Admin Operations"
      description: "Admin-only operations with password protection"
      status: TODO
      priority: MEDIUM
      effort: "1 day"
      depends_on: ["cache_2"]
      files_to_create:
        - "src/admin_operations.py"
      methods_to_implement:
        - "verify_admin(password)"
        - "delete_program_admin()"
        - "restore_program_admin()"
        - "view_deleted_programs()"
        - "purge_program() - hard delete"
      notes: |
        Admin password from environment variable:
        DATA_ANALYZER_ADMIN_PASSWORD

        All admin operations:
        - Require password verification
        - Log to execution_history
        - Support soft delete (status=deleted)
        - Store deletion reason

    - id: cache_6
      name: "Unit Tests for Program Cache"
      description: "Comprehensive tests for all cache operations"
      status: TODO
      priority: HIGH
      effort: "2 days"
      depends_on: ["cache_2", "cache_3", "cache_4", "cache_5"]
      files_to_create:
        - "tests/test_program_cache.py"
        - "tests/test_program_manager.py"
      test_coverage:
        - "CRUD operations"
        - "Alias creation and uniqueness"
        - "Admin operations"
        - "Auto-naming logic"
        - "Error handling"
        - "Concurrent access"

    - id: cache_7
      name: "Integration with Web App"
      description: "Add program management UI to web_app.py"
      status: TODO
      priority: HIGH
      effort: "3 days"
      depends_on: ["cache_3"]
      files_to_modify:
        - "web_app.py"
      ui_sections_to_add:
        - "Saved Programs List - view all programs with metadata"
        - "Create Alias UI - add aliases to programs"
        - "Program Search - find programs by name/alias/source"
        - "Admin Panel - delete/restore programs (password protected)"
        - "Program Usage History - show execution stats"
      notes: |
        Update web_app.py to:
        1. After dictionary parsing, save as program
        2. Allow users to select saved programs for analysis
        3. Display program metadata (use count, last used, etc.)
        4. Create aliases with uniqueness check
        5. Admin panel for program management

# PRIORITY 2: Feature 1 - Logic Validation Engine (CORE FUNCTIONALITY)
phase_logic_validation:
  name: "Logic Validation Engine"
  status: TODO
  priority: CRITICAL
  description: |
    Extract and validate conditional logic rules from data dictionaries.
    Examples: "If male, skip pregnancy questions", "If placebo, dosage must be blank"
  estimated_effort: "2-3 weeks"
  depends_on: ["phase_program_cache"]
  blocks: []

  tasks:
    - id: logic_1
      name: "Extend FieldDefinition for Conditional Rules"
      description: "Add ConditionalRule dataclass to llm_client.py"
      status: TODO
      priority: CRITICAL
      effort: "1 day"
      files_to_modify:
        - "src/llm_client.py"
      notes: |
        Add ConditionalRule dataclass:
        - rule_id (unique identifier)
        - rule_type (skip_if, required_if, allowed_if, calculate, range_if)
        - condition (Python expression: "row['gender'] == 'Male'")
        - action (skip, require, validate_range, calculate)
        - affected_fields (list of field names)
        - description (natural language)
        - severity (error, warning)
        - confidence (0.0-1.0 for learned rules)

        Update FieldDefinition to include:
        - conditional_rules: List[ConditionalRule]

    - id: logic_2
      name: "Update LLM Extraction Prompt for Logic"
      description: "Enhance prompt to extract conditional logic rules"
      status: TODO
      priority: CRITICAL
      effort: "2 days"
      depends_on: ["logic_1"]
      files_to_modify:
        - "src/llm_client.py"
      notes: |
        Update create_extraction_prompt() to request:
        - Skip logic patterns
        - Conditional requirements
        - Field dependencies
        - Calculations
        - Range dependencies based on other fields

        Provide examples of logic patterns:
        - "If [field] = [value], then [action] on [target_fields]"
        - "Skip Q5-Q10 if Q4='No'"
        - "Required if [condition]"

    - id: logic_3
      name: "Enhance LLM Response Parsing for Logic"
      description: "Parse conditional_rules from LLM JSON response"
      status: TODO
      priority: CRITICAL
      effort: "2 days"
      depends_on: ["logic_2"]
      files_to_modify:
        - "src/llm_client.py"
      notes: |
        Update parse_llm_response() to:
        - Parse conditional_rules array
        - Convert natural language conditions to Python expressions
        - Validate expressions are safe (no imports, no file I/O)
        - Handle nested conditions

    - id: logic_4
      name: "Test Logic Extraction with REDCap Dictionary"
      description: "Test extraction with real REDCap dictionary"
      status: TODO
      priority: HIGH
      effort: "1 day"
      depends_on: ["logic_3"]
      files_to_create:
        - "tests/test_data/redcap_with_logic.csv"
        - "tests/test_logic_extraction.py"
      notes: |
        Create test REDCap dictionary with:
        - Skip logic (branching logic column)
        - Conditional fields
        - Calculated fields

        Verify extraction accuracy

    - id: logic_5
      name: "Create LogicCodeGenerator Class"
      description: "Generate Python validation code from rules"
      status: TODO
      priority: CRITICAL
      effort: "3 days"
      depends_on: ["logic_3"]
      files_to_create:
        - "src/logic_engine.py"
      methods_to_implement:
        - "generate_validation_function(rules)"
        - "validate_generated_code(code)"
        - "_create_prompt_for_code_generation()"
        - "_parse_code_response()"
      notes: |
        LogicCodeGenerator uses LLM to generate Python code that:
        - Takes DataFrame as input
        - Iterates through rows
        - Checks each conditional rule
        - Returns list of violations

        Generated code must be:
        - Clean and readable
        - Well-documented with docstrings
        - Type-hinted
        - Safe (no dangerous operations)

    - id: logic_6
      name: "Create LogicValidator Class"
      description: "Execute validation code in sandboxed environment"
      status: TODO
      priority: CRITICAL
      effort: "2 days"
      depends_on: ["logic_5"]
      files_to_modify:
        - "src/logic_engine.py"
      methods_to_implement:
        - "execute_validation(code, df)"
        - "_create_safe_globals()"
        - "_validate_code_safety()"
      notes: |
        LogicValidator provides:
        - Sandboxed execution (RestrictedPython or AST validation)
        - Timeout protection (60 seconds max)
        - Safe modules only (pandas, numpy, datetime)
        - No file I/O, no imports, no exec/eval
        - Exception handling and logging

        Returns standardized violation format

    - id: logic_7
      name: "Test Code Generation and Execution"
      description: "Test full logic validation pipeline"
      status: TODO
      priority: HIGH
      effort: "2 days"
      depends_on: ["logic_6"]
      files_to_create:
        - "tests/test_logic_engine.py"
        - "tests/test_data/sample_logic_violations.csv"
      test_coverage:
        - "Code generation from rules"
        - "Safe execution"
        - "Violation detection"
        - "Error handling"
        - "Performance with large datasets"

    - id: logic_8
      name: "Integrate Logic Validation with QualityPipeline"
      description: "Add logic validation to existing pipeline"
      status: TODO
      priority: HIGH
      effort: "2 days"
      depends_on: ["logic_6"]
      files_to_modify:
        - "mcp_server.py"
      notes: |
        Add validate_logic() method to QualityPipeline:
        - Load validation program from cache
        - Execute logic validator
        - Merge logic violations with existing issues
        - Return comprehensive results

    - id: logic_9
      name: "Update Web App for Logic Violations"
      description: "Display logic violations in results"
      status: TODO
      priority: HIGH
      effort: "2 days"
      depends_on: ["logic_8"]
      files_to_modify:
        - "web_app.py"
      ui_updates:
        - "Add 'Logic Violations' section to results"
        - "Show rule description and affected rows"
        - "Color-code by severity"
        - "Add filters for violation types"

    - id: logic_10
      name: "Optional: Statistical Pattern Learning"
      description: "Learn implicit rules from data patterns"
      status: TODO
      priority: LOW
      effort: "1 week"
      depends_on: ["logic_8"]
      files_to_create:
        - "src/pattern_learner.py"
      notes: |
        OPTIONAL FEATURE - Can be implemented later

        PatternLearner discovers:
        - Co-occurrence patterns (A=X implies B=Y)
        - Null patterns (A=X implies B is null)
        - Range correlations

        Presents as "suspected rules" with confidence scores
        for human review

