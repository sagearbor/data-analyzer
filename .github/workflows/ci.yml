# CI: offline test suite + repository hygiene gate.
#
# Actions are pinned by MAJOR VERSION TAG, not commit SHA (exact SHAs were not
# verifiable when this file was written). Pin by SHA before relying on this as a
# supply-chain control.
#
# NOTE: the "repo-hygiene" job currently FAILS by design: sidecar files
# (":sec.endpointdlp" / ":Zone.Identifier") are tracked under tests/test_data/
# pending an owner decision. It is a separate job so the test job's result stays
# readable. It passes once those files are removed from git.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Offline test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r api_requirements.txt -r mcp_requirements.txt -r requirements-test.txt

      - name: Run tests (offline; no cloud credentials are provided)
        env:
          APP_ENV: test
          LLM_AUTH: key
          AZURE_OPENAI_API_KEY: ci-dummy-not-a-real-key
        run: python -m pytest tests -q -p no:cacheprovider -W ignore

  repo-hygiene:
    name: Repo hygiene (no sidecar or secret-named files tracked)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail on tracked sidecar or secret-named files
        run: |
          bad=$(git ls-files | grep -E ':sec\.endpointdlp$|:Zone\.Identifier$|(^|/)\.env$|(^|/)\.env\.[^/]+$|\.pem$|\.key$' | grep -v -E '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "Tracked files that must not be committed:"
            echo "$bad"
            exit 1
          fi
          echo "No sidecar or secret-named files are tracked."
