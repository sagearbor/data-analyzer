# .github/workflows/deploy-cloudrun.yml
#
# Manual GitHub Actions workflow to build and deploy the data-analyzer API
# to Google Cloud Run with IAM-authenticated ingress.
#
# ######################################################################
# # NOT USED FOR THE RELEASE. The supported production target is Azure #
# # Container Apps (deploy/aca/). This path is kept only pending an    #
# # owner retire/keep decision (ADP-81).                               #
# ######################################################################
#
# ============================================================
# REQUIRED GITHUB SECRET
# ============================================================
# GCP_SA_KEY
#   JSON key for a GCP Service Account with the following IAM roles:
#     - roles/run.admin                    (deploy Cloud Run services)
#     - roles/cloudbuild.builds.editor     (submit Cloud Build jobs)
#     - roles/artifactregistry.admin       (create repos, push images)
#     - roles/iam.serviceAccountUser       (impersonate the Cloud Build SA)
#     - roles/storage.admin                (Cloud Build source staging bucket)
#
#   Create the key:
#     gcloud iam service-accounts create gh-deploy-sa \
#         --display-name="GitHub Actions deployer"
#     gcloud projects add-iam-policy-binding PROJECT_ID \
#         --member="serviceAccount:gh-deploy-sa@PROJECT_ID.iam.gserviceaccount.com" \
#         --role=roles/run.admin
#     # (repeat for each role above)
#     gcloud iam service-accounts keys create sa-key.json \
#         --iam-account=gh-deploy-sa@PROJECT_ID.iam.gserviceaccount.com
#   Then add the contents of sa-key.json as the GCP_SA_KEY repository secret.
#
# SECURITY NOTE — Workload Identity Federation is the more secure alternative:
#   WIF eliminates long-lived service account keys by federating GitHub's OIDC
#   token directly. See:
#   https://github.com/google-github-actions/auth#setting-up-workload-identity-federation
#   Use google-github-actions/auth@v2 with workload_identity_provider + service_account
#   instead of credentials_json to adopt WIF.
#
# ============================================================
# AUTHENTICATION
# ============================================================
# The service is deployed with --no-allow-unauthenticated (callers need
# roles/run.invoker), APP_ENV=prod, and DATA_ANALYZER_API_KEY bound from a
# Secret Manager secret named by the api_key_secret input. Never add
# --allow-unauthenticated.
#
# Dispatch inputs are passed to steps through env variables (never expanded
# inside run: scripts) and validated first. Actions are pinned by major version
# tag, not commit SHA; pin by SHA before any real use.
# ============================================================

name: Deploy to Cloud Run

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'GCP Project ID'
        required: true
        type: string
      region:
        description: 'GCP region'
        required: false
        default: 'us-central1'
        type: string
      service:
        description: 'Cloud Run service name'
        required: false
        default: 'data-analyzer-api'
        type: string
      api_key_secret:
        description: 'Secret Manager secret name holding the API key (bound as DATA_ANALYZER_API_KEY)'
        required: true
        type: string

# Dispatch inputs reach shell only as environment variables.
env:
  PROJECT_ID: ${{ inputs.project_id }}
  REGION: ${{ inputs.region }}
  SERVICE: ${{ inputs.service }}
  API_KEY_SECRET: ${{ inputs.api_key_secret }}

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # needed if/when switching to Workload Identity Federation

    steps:
      # ------------------------------------------------------------------
      # 0. Validate dispatch inputs before they are used anywhere
      # ------------------------------------------------------------------
      - name: Validate inputs
        run: |
          [[ "$PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || { echo "invalid project_id"; exit 1; }
          [[ "$REGION" =~ ^[a-z]+-[a-z]+[0-9]+$ ]] || { echo "invalid region"; exit 1; }
          [[ "$SERVICE" =~ ^[a-z][a-z0-9-]{0,48}[a-z0-9]$ ]] || { echo "invalid service"; exit 1; }
          [[ "$API_KEY_SECRET" =~ ^[A-Za-z0-9_-]{1,255}$ ]] || { echo "invalid api_key_secret"; exit 1; }

      # ------------------------------------------------------------------
      # 1. Checkout source
      # ------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Authenticate to GCP using the service account JSON key.
      #    To switch to Workload Identity Federation, replace credentials_json
      #    with workload_identity_provider and service_account inputs.
      # ------------------------------------------------------------------
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # ------------------------------------------------------------------
      # 3. Set up gcloud CLI
      # ------------------------------------------------------------------
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ inputs.project_id }}

      # ------------------------------------------------------------------
      # 4. Derive image path and configure Docker for Artifact Registry
      # ------------------------------------------------------------------
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      # ------------------------------------------------------------------
      # 5. Ensure Artifact Registry repository 'apps' exists (idempotent)
      # ------------------------------------------------------------------
      - name: Ensure Artifact Registry repository
        run: |
          gcloud artifacts repositories create apps \
            --repository-format=docker \
            --location="${REGION}" \
            --project="${PROJECT_ID}" \
            --description="Container images for deployed services" \
            2>&1 || true

      # ------------------------------------------------------------------
      # 6. Build and push image via Cloud Build
      # ------------------------------------------------------------------
      - name: Build and push image
        env:
          IMAGE: "${{ inputs.region }}-docker.pkg.dev/${{ inputs.project_id }}/apps/${{ inputs.service }}:${{ github.sha }}"
        run: |
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --substitutions="_IMAGE=${IMAGE}" \
            --project="${PROJECT_ID}" \
            .

      # ------------------------------------------------------------------
      # 7. Deploy to Cloud Run (IAM-authenticated, API key bound, APP_ENV=prod)
      # ------------------------------------------------------------------
      - name: Deploy to Cloud Run
        env:
          IMAGE: "${{ inputs.region }}-docker.pkg.dev/${{ inputs.project_id }}/apps/${{ inputs.service }}:${{ github.sha }}"
        run: |
          gcloud run deploy "${SERVICE}" \
            --image="${IMAGE}" \
            --region="${REGION}" \
            --platform=managed \
            --no-allow-unauthenticated \
            --port=8000 \
            --set-env-vars="APP_ENV=prod" \
            --set-secrets="DATA_ANALYZER_API_KEY=${API_KEY_SECRET}:latest" \
            --project="${PROJECT_ID}"

      # ------------------------------------------------------------------
      # 8. Retrieve and print the service URL
      # ------------------------------------------------------------------
      - name: Get service URL
        id: get-url
        run: |
          SERVICE_URL=$(gcloud run services describe "${SERVICE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format='value(status.url)')
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"
          echo "Service deployed at: ${SERVICE_URL}"

      # ------------------------------------------------------------------
      # 9. Write URL to job summary
      # ------------------------------------------------------------------
      - name: Write summary
        env:
          SERVICE_URL: ${{ steps.get-url.outputs.service_url }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Cloud Run Deployment"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Service | \`${SERVICE}\` |"
            echo "| Region | \`${REGION}\` |"
            echo "| Project | \`${PROJECT_ID}\` |"
            echo "| Commit | \`${COMMIT_SHA}\` |"
            echo "| **URL (IAM-authenticated, not public)** | ${SERVICE_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
